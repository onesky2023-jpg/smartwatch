<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>낙상 탐지 파이프라인 — Amicus Brain</title>
<style>
  :root{--bg:#ffffff;--bg2:#f5f5f4;--bg3:#ededec;--tx:#1a1a1a;--tx2:#6b6b6b;--tx3:#9b9b9b;--bd:#e0e0de;--blue:#2563eb;--blue-bg:#eff6ff;--green:#0f6e56;--green-bg:#e1f5ee;--amber:#854f0b;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb;--red-strong:#e24b4a;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  @media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#262626;--bg3:#333;--tx:#e5e5e5;--tx2:#a0a0a0;--tx3:#707070;--bd:#404040;--blue:#60a5fa;--blue-bg:#1e3a5f;--green:#5dcaa5;--green-bg:#0a3d2e;--amber:#f0997b;--amber-bg:#4a2a10;--red:#f09595;--red-bg:#501313;--red-strong:#e24b4a}}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);background:var(--bg);color:var(--tx);padding:16px;max-width:720px;margin:0 auto;font-size:14px;line-height:1.6}
  h2{font-size:16px;font-weight:600;margin:0 0 12px}
  .room-wrap{position:relative;width:100%;aspect-ratio:680/400;margin:0 0 10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
  .room-wrap svg{width:100%;height:100%}
  .step-row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
  .sb{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);transition:all .15s;user-select:none;font-family:var(--font)}
  .sb:hover{border-color:var(--tx3)}.sb.on{background:var(--red-bg);color:var(--red);border-color:var(--red);font-weight:600}.sb.safe{background:var(--green-bg);color:var(--green);border-color:var(--green);font-weight:600}
  .ip{padding:12px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);font-size:13px;line-height:1.7;color:var(--tx2);min-height:54px}
  .ip b{color:var(--tx);font-weight:600}
  .pr{display:flex;gap:5px;align-items:center;margin:10px 0 8px;flex-wrap:wrap}
  .pn{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--bd);background:var(--bg);color:var(--tx3);transition:all .2s;white-space:nowrap}
  .pn.lit{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
  .pn.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
  .pn.alert{border-color:var(--red);color:var(--red);background:var(--red-bg)}
  .pa{color:var(--tx3);font-size:11px}.pa.lit{color:var(--blue)}.pa.warn{color:var(--amber)}.pa.alert{color:var(--red)}
  .lg{display:flex;gap:14px;font-size:11px;color:var(--tx3);margin:4px 0 8px;flex-wrap:wrap}
  .ld{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
  .mr{display:flex;gap:8px;margin:8px 0 10px;flex-wrap:wrap}
  .mc{padding:7px 11px;border-radius:6px;background:var(--bg2);border:1px solid var(--bd);font-size:11px;color:var(--tx2);transition:all .2s;flex:1;min-width:85px}
  .mc .v{font-size:15px;font-weight:600;color:var(--tx);margin-top:2px;transition:color .2s}
  .mc.warn .v{color:var(--amber)}.mc.alert .v{color:var(--red)}
</style>
</head>
<body>
<h2>낙상(Fall) 탐지 파이프라인</h2>

<div class="room-wrap">
  <svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="40" y="20" width="600" height="360" rx="4" fill="none" stroke="var(--tx3)" stroke-width="0.5" stroke-dasharray="6 3"/>
    <text x="52" y="40" fill="var(--tx3)" font-size="12" font-family="var(--font)">카메라 뷰</text>
    <rect x="40" y="310" width="600" height="2" rx="1" fill="var(--tx3)" opacity="0.15"/>
    <text x="52" y="332" fill="var(--tx3)" font-size="11" font-family="var(--font)" opacity="0.4">바닥면</text>

    <g id="skel">
      <circle id="k-head" cx="200" cy="80" r="10" fill="none" stroke="#1D9E75" stroke-width="2"/>
      <circle id="k-neck" cx="200" cy="105" r="3" fill="#1D9E75"/>
      <circle id="k-lsh" cx="170" cy="120" r="3" fill="#1D9E75"/>
      <circle id="k-rsh" cx="230" cy="120" r="3" fill="#1D9E75"/>
      <circle id="k-lel" cx="155" cy="165" r="3" fill="#1D9E75"/>
      <circle id="k-rel" cx="245" cy="165" r="3" fill="#1D9E75"/>
      <circle id="k-lwr" cx="148" cy="210" r="3" fill="#1D9E75"/>
      <circle id="k-rwr" cx="252" cy="210" r="3" fill="#1D9E75"/>
      <circle id="k-lhip" cx="180" cy="210" r="3" fill="#1D9E75"/>
      <circle id="k-rhip" cx="220" cy="210" r="3" fill="#1D9E75"/>
      <circle id="k-lkn" cx="175" cy="260" r="3" fill="#1D9E75"/>
      <circle id="k-rkn" cx="225" cy="260" r="3" fill="#1D9E75"/>
      <circle id="k-lan" cx="172" cy="305" r="3" fill="#1D9E75"/>
      <circle id="k-ran" cx="228" cy="305" r="3" fill="#1D9E75"/>
      <line id="b-sp" x1="200" y1="90" x2="200" y2="105" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-la1" x1="200" y1="105" x2="170" y2="120" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-ra1" x1="200" y1="105" x2="230" y2="120" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-la2" x1="170" y1="120" x2="155" y2="165" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-ra2" x1="230" y1="120" x2="245" y2="165" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-la3" x1="155" y1="165" x2="148" y2="210" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-ra3" x1="245" y1="165" x2="252" y2="210" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-t1" x1="200" y1="105" x2="180" y2="210" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-t2" x1="200" y1="105" x2="220" y2="210" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-ll1" x1="180" y1="210" x2="175" y2="260" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-rl1" x1="220" y1="210" x2="225" y2="260" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-ll2" x1="175" y1="260" x2="172" y2="305" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-rl2" x1="225" y1="260" x2="228" y2="305" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-hp" x1="180" y1="210" x2="220" y2="210" stroke="#1D9E75" stroke-width="1.5"/>
      <line id="b-sh" x1="170" y1="120" x2="230" y2="120" stroke="#1D9E75" stroke-width="1.5"/>
    </g>
    <rect id="bbox" x="0" y="0" width="0" height="0" rx="2" fill="none" stroke="none" stroke-width="1.5"/>
    <g id="rpanel" opacity="0">
      <rect x="420" y="50" width="200" height="130" rx="8" fill="var(--bg2)" stroke="var(--bd)" stroke-width="0.5"/>
      <text id="rp-t" x="440" y="76" fill="var(--green)" font-size="14" font-weight="600" font-family="var(--font)"></text>
      <text id="rp1" x="440" y="98" fill="var(--tx2)" font-size="12" font-family="var(--font)"></text>
      <text id="rp2" x="440" y="118" fill="var(--tx2)" font-size="12" font-family="var(--font)"></text>
      <text id="rp3" x="440" y="138" fill="var(--tx2)" font-size="12" font-family="var(--font)"></text>
      <text id="rp4" x="440" y="158" fill="var(--tx2)" font-size="12" font-family="var(--font)"></text>
    </g>
  </svg>
</div>

<div class="lg">
  <span><span class="ld" style="background:#1D9E75"></span>정상 키포인트</span>
  <span><span class="ld" style="background:#BA7517"></span>불안정</span>
  <span><span class="ld" style="background:#E24B4A"></span>낙상 판정</span>
</div>

<div class="mr">
  <div class="mc" id="m0"><span>몸체 기울기</span><div class="v" id="v0">0°</div></div>
  <div class="mc" id="m1"><span>수직 속도</span><div class="v" id="v1">0 px/s</div></div>
  <div class="mc" id="m2"><span>머리-바닥 비율</span><div class="v" id="v2">100%</div></div>
  <div class="mc" id="m3"><span>자세 분류</span><div class="v" id="v3">서 있음</div></div>
</div>

<div class="pr">
  <span class="pn" id="p0">카메라 입력</span><span class="pa" id="a0">→</span>
  <span class="pn" id="p1">YOLOv8-Pose</span><span class="pa" id="a1">→</span>
  <span class="pn" id="p2">자세 분류</span><span class="pa" id="a2">→</span>
  <span class="pn" id="p3">낙상 판정</span><span class="pa" id="a3">→</span>
  <span class="pn" id="p4">알림 발송</span>
</div>

<div class="step-row">
  <button class="sb safe" onclick="go(0)">1. 서 있음</button>
  <button class="sb" onclick="go(1)">2. 키포인트 추출</button>
  <button class="sb" onclick="go(2)">3. 비틀거림</button>
  <button class="sb" onclick="go(3)">4. 넘어지는 중</button>
  <button class="sb" onclick="go(4)">5. 바닥 충돌</button>
  <button class="sb" onclick="go(5)">6. 낙상 확정</button>
</div>

<div class="ip" id="info">
  <b>정상 상태</b> — 환자가 서 있는 자세. 17개 관절 키포인트가 수직 정렬. 머리-바닥 비율 높고 기울기 0°.
</div>

<script>
const $=id=>document.getElementById(id);
const KP={
  standing:{head:[200,80],neck:[200,105],lsh:[170,120],rsh:[230,120],lel:[155,165],rel:[245,165],lwr:[148,210],rwr:[252,210],lhip:[180,210],rhip:[220,210],lkn:[175,260],rkn:[225,260],lan:[172,305],ran:[228,305]},
  stumble:{head:[230,95],neck:[225,115],lsh:[200,135],rsh:[255,125],lel:[185,175],rel:[270,155],lwr:[178,220],rwr:[280,175],lhip:[205,215],rhip:[240,210],lkn:[195,265],rkn:[235,258],lan:[190,305],ran:[232,305]},
  falling:{head:[310,180],neck:[290,190],lsh:[270,205],rsh:[310,195],lel:[255,240],rel:[330,210],lwr:[250,270],rwr:[345,225],lhip:[275,240],rhip:[305,235],lkn:[260,275],rkn:[300,270],lan:[230,295],ran:[285,298]},
  ground:{head:[350,285],neck:[330,290],lsh:[310,295],rsh:[350,290],lel:[290,298],rel:[370,288],lwr:[275,302],rwr:[388,285],lhip:[315,298],rhip:[345,296],lkn:[295,302],rkn:[365,300],lan:[278,305],ran:[382,303]}
};
const ids=['head','neck','lsh','rsh','lel','rel','lwr','rwr','lhip','rhip','lkn','rkn','lan','ran'];
const bn=[['sp','head','neck'],['la1','neck','lsh'],['ra1','neck','rsh'],['la2','lsh','lel'],['ra2','rsh','rel'],['la3','lel','lwr'],['ra3','rel','rwr'],['t1','neck','lhip'],['t2','neck','rhip'],['ll1','lhip','lkn'],['rl1','rhip','rkn'],['ll2','lkn','lan'],['rl2','rkn','ran'],['hp','lhip','rhip'],['sh','lsh','rsh']];
const clr={standing:'#1D9E75',stumble:'#BA7517',falling:'#E24B4A',ground:'#E24B4A'};

function setSkel(p,c){
  const d=KP[p];
  ids.forEach(id=>{const e=$('k-'+id);e.setAttribute('cx',d[id][0]);e.setAttribute('cy',d[id][1]);e.setAttribute(id==='head'?'stroke':'fill',c);if(id==='head')e.setAttribute('fill','none');});
  bn.forEach(b=>{const e=$('b-'+b[0]),p1=d[b[1]],p2=d[b[2]];e.setAttribute('x1',p1[0]);e.setAttribute('y1',b[0]==='sp'?p1[1]+10:p1[1]);e.setAttribute('x2',p2[0]);e.setAttribute('y2',p2[1]);e.setAttribute('stroke',c);});
}
function setBB(p,c,show){
  if(!show){$('bbox').setAttribute('stroke','none');return;}
  const d=KP[p],xs=ids.map(k=>d[k][0]),ys=ids.map(k=>d[k][1]);
  const mx=Math.min(...xs)-15,my=Math.min(...ys)-15,Mx=Math.max(...xs)+15,My=Math.max(...ys)+15;
  $('bbox').setAttribute('x',mx);$('bbox').setAttribute('y',my);$('bbox').setAttribute('width',Mx-mx);$('bbox').setAttribute('height',My-my);$('bbox').setAttribute('stroke',c);$('bbox').setAttribute('stroke-width','1.5');
}

const S=[
  {p:'standing',bb:false,rp:false,pipe:[],pw:[],pa:[],vals:['0°','0 px/s','100%','서 있음'],mc:['','','',''],
   rpt:'',rpv:['','','',''],
   t:'<b>정상 상태</b> — 환자가 서 있는 자세. 17개 관절 키포인트가 수직 정렬. 머리-바닥 비율 높고 기울기 0°.'},
  {p:'standing',bb:true,rp:true,pipe:[0,1],pw:[],pa:[],vals:['0°','0 px/s','100%','서 있음'],mc:['','','',''],
   rpt:'키포인트 추출',rpv:['관절 17개 감지','신뢰도: 0.96','바운딩 박스 생성','수직 정렬 확인'],
   t:'<b>YOLOv8-Pose 키포인트 추출</b> — 단일 프레임에서 17개 관절 좌표와 신뢰도를 추출. 바운딩 박스 종횡비(세로>가로)로 "서 있음" 초기 판별.'},
  {p:'stumble',bb:true,rp:true,pipe:[0,1,2],pw:[2],pa:[],vals:['18°','45 px/s','82%','불안정'],mc:['warn','','','warn'],
   rpt:'불안정 감지',rpv:['기울기 18° (임계: 30°)','측면 흔들림 감지','수직 속도 증가 중','관찰 지속...'],
   t:'<b>비틀거림 감지</b> — 어깨-엉덩이 축이 18° 기울어짐. 낙상 임계값(30°) 이하이지만 "불안정"으로 전환. 알림 없이 프레임 연속 추적.'},
  {p:'falling',bb:true,rp:true,pipe:[0,1,2,3],pw:[],pa:[3],vals:['52°','280 px/s','48%','낙상 중'],mc:['alert','alert','warn','alert'],
   rpt:'낙상 진행 중',rpv:['기울기 52° > 임계 30°','수직 속도 280px/s','머리 높이 급감','낙상 판정 준비'],
   t:'<b>낙상 진행 중</b> — 수직 속도 280px/s 급증, 기울기 52°로 임계값 초과. 머리-바닥 비율 48%. "낙상 중" 분류. 주저앉기와 구분 필요.'},
  {p:'ground',bb:true,rp:true,pipe:[0,1,2,3],pw:[],pa:[3],vals:['85°','0 px/s','8%','바닥 충돌'],mc:['alert','','alert','alert'],
   rpt:'바닥 충돌 확인',rpv:['키포인트 수평 배열','머리 높이 ≈ 바닥면','수직 속도 0 (정지)','2초 대기 후 확정'],
   t:'<b>바닥 충돌</b> — 키포인트가 바닥면과 수평 배열. 바운딩 박스 종횡비 역전. <b>2초간 대기</b> — 스스로 일어나면 오탐 방지.'},
  {p:'ground',bb:true,rp:true,pipe:[0,1,2,3,4],pw:[],pa:[3,4],vals:['85°','0 px/s','8%','낙상 확정'],mc:['alert','','alert','alert'],
   rpt:'⚠ 낙상 확정',rpv:['2초 이상 바닥 유지','자세 변화 없음','Immediate 알림','오디오: 충격음 감지'],
   t:'<b>⚠ 낙상 확정</b> — 2초 경과 후에도 수평 자세 유지. YAMNet이 충격음/신음 병렬 감지. 스마트워치 강한 햅틱 + 앱 푸시 + 영상 클립(전후 10초) 자동 저장.'}
];

function go(s){
  const d=S[s],c=clr[d.p];
  setSkel(d.p,c);setBB(d.p,c,d.bb);
  $('rpanel').setAttribute('opacity',d.rp?'1':'0');
  if(d.rp){$('rp-t').textContent=d.rpt;$('rp-t').setAttribute('fill',c);d.rpv.forEach((t,i)=>$('rp'+(i+1)).textContent=t);}
  d.vals.forEach((v,i)=>$('v'+i).textContent=v);
  [0,1,2,3].forEach(i=>{$('m'+i).classList.remove('warn','alert');if(d.mc[i])$('m'+i).classList.add(d.mc[i]);});
  [0,1,2,3,4].forEach(i=>{const n=$('p'+i);n.classList.remove('lit','warn','alert');if(d.pa.includes(i))n.classList.add('alert');else if(d.pw.includes(i))n.classList.add('warn');else if(d.pipe.includes(i))n.classList.add('lit');});
  [0,1,2,3].forEach(i=>{const a=$('a'+i);a.classList.remove('lit','warn','alert');const ni=i+1;if(d.pa.includes(ni))a.classList.add('alert');else if(d.pw.includes(ni))a.classList.add('warn');else if(d.pipe.includes(ni))a.classList.add('lit');});
  document.querySelectorAll('.sb').forEach((b,i)=>{b.classList.remove('on','safe');if(i===s)b.classList.add(s<=1?'safe':'on');});
  $('info').innerHTML=d.t;
}
</script>
</body>
</html>
